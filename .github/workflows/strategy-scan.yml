# Investor Watch v1.12 — STRATEGY SCAN (bina VPS) — MT5 + MT4 + Live Record (MT4 + MT5)
# GitHub ki free Windows machine par MT5 install -> investor login -> poori history + candles
# -> strategy analyser -> data/<login>/strategy.json + STRATEGY.md (+ history.json/live.json agar EA nahi likhta)
# App ke "Scan" tab se chalta hai (ya Actions > Strategy Scan > Run workflow).
# Password sirf ENCRYPTED aata hai. Ek baar repo secret banao: IW_KEY = apni secret key (app me bhi wahi).
name: Strategy Scan
run-name: Scan ${{ inputs.login }}
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'MT5 ya MT4'
        required: false
        default: 'MT5'
      login:
        description: 'MT4/MT5 account number'
        required: true
      server:
        description: 'Server naam (jaise XMGlobal-MT5 12)'
        required: true
      enc:
        description: 'Encrypted investor password (app banata hai)'
        required: true
      installer:
        description: 'Broker ka MT4/MT5 installer link (MT5 me khaali = MetaQuotes wala; MT4 me zaroori)'
        required: false
        default: ''
      days:
        description: 'Kitne din ki history (0 = sab)'
        required: false
        default: '0'
      record:
        description: 'Live Record minute, MT4 + MT5 (0 = sirf scan, max ~300)'
        required: false
        default: '0'
      rec_symbol:
        description: 'Record kis symbol par (khaali = sabse zyada trade wala)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: scan-${{ inputs.login }}
  cancel-in-progress: true
jobs:
  scan:
    runs-on: windows-latest
    timeout-minutes: 330
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python packages
        shell: bash
        run: python -m pip install -q MetaTrader5 cryptography
      - name: MT5 install
        shell: pwsh
        env:
          IW_INSTALLER: ${{ inputs.installer }}
          IW_PLATFORM: ${{ inputs.platform }}
          IW_SERVER: ${{ inputs.server }}
        run: |
          $url = $env:IW_INSTALLER
          $mt4 = ($env:IW_PLATFORM -eq 'MT4')
          $exe = if ($mt4) { 'terminal.exe' } else { 'terminal64.exe' }
          if ($mt4) {
            if (-not $url) { Write-Host '::error::MT4 ke liye broker ka MT4 installer link zaroori hai'; exit 1 }
            Write-Host "Installer: $url"
            Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\mt5setup.exe"
          } else {
          function Get-BrokerInstaller([string]$srv, [string]$given) {
            # v1.14.1: broker ka apna MT5 installer (generic MetaQuotes wala broker server nahi jaanta -> IPC timeout)
            if ($given) { return @($given) }
            $s = $srv.ToLower()
            if ($s -match 'exness')  { return @('https://download.mql5.com/cdn/web/exness.technologies.ltd/mt5/exness5setup.exe') }
            if ($s -match 'capital') { return @('https://download.mql5.com/cdn/web/capital.nine.global/mt5/capitalnineglobal5setup.exe') }
            if ($s -match 'vantage') { return @(
                'https://download.mql5.com/cdn/web/vantage.international.group.limited/mt5/vantageinternational5setup.exe',
                'https://download.mql5.com/cdn/web/vantage.international.group/mt5/vantageinternational5setup.exe',
                'https://download.mql5.com/cdn/web/vantage.global.limited/mt5/vantageinternational5setup.exe',
                'https://download.mql5.com/cdn/web/vantage.markets/mt5/vantagemarkets5setup.exe') }
            return @()
          }
          function Get-Installer([string]$srv, [string]$given, [string]$out) {
            $generic = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'
            foreach ($u in (Get-BrokerInstaller $srv $given)) {
              try { Invoke-WebRequest -Uri $u -OutFile $out -ErrorAction Stop; if ((Get-Item $out).Length -gt 500000) { Write-Host "Installer: $u"; return } }
              catch { Write-Host "Installer nahi mila: $u" }
            }
            Write-Host "::warning::Broker installer nahi mila — generic MetaQuotes installer"
            Invoke-WebRequest -Uri $generic -OutFile $out
          }
            Get-Installer $env:IW_SERVER $url "$env:RUNNER_TEMP\mt5setup.exe"
          }
          Start-Process "$env:RUNNER_TEMP\mt5setup.exe" -ArgumentList '/auto'
          $term = $null
          for ($i = 0; $i -lt 60 -and -not $term; $i++) {
            Start-Sleep -Seconds 10
            $term = Get-ChildItem 'C:\Program Files','C:\Program Files (x86)' -Recurse -Filter $exe -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $term) { Write-Host "::error::Install nahi hua ($exe nahi mila) — installer link sahi hai?"; exit 1 }
          Start-Sleep -Seconds 25
          Get-Process terminal64, terminal, mt5setup, mt4setup -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host "Terminal: $($term.FullName)"
          "IW_TERM=$($term.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: MT4/MT5 se data (investor login)
        shell: bash
        env:
          IW_PLATFORM: ${{ inputs.platform }}
          IW_LOGIN: ${{ inputs.login }}
          IW_SERVER: ${{ inputs.server }}
          IW_ENC: ${{ inputs.enc }}
          IW_DAYS: ${{ inputs.days }}
          IW_RECORD: ${{ inputs.record }}
          IW_RECSYM: ${{ inputs.rec_symbol }}
          IW_KEY: ${{ secrets.IW_KEY }}
        run: |
          if [ "$IW_PLATFORM" = "MT4" ]; then python scripts/mt4_run.py "$IW_TERM" scan_tmp
          else python scripts/mt5_fetch.py "$IW_TERM" scan_tmp; fi
      - name: Strategy nikalo
        shell: bash
        env:
          IW_LOGIN: ${{ inputs.login }}
        run: python scripts/strategy_scan.py scan_tmp/raw.json "data/$IW_LOGIN"
      - name: Raw data artifact (deep analysis ke liye, 7 din)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ inputs.login }}
          path: scan_tmp/raw.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Nateeja repo me (fail ho to bhi status)
        if: always()
        shell: bash
        env:
          IW_LOGIN: ${{ inputs.login }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$IW_LOGIN" in ''|*[!0-9]*) echo "login galat"; exit 1;; esac
          mkdir -p "data/$IW_LOGIN"
          python - <<'PY'
          import json, os, time
          acc = os.environ['IW_LOGIN']
          try: st = json.load(open('scan_tmp/status.json'))
          except Exception: st = {'stage': 'setup', 'ok': False, 'msg': 'MT5 install / setup me dikkat — run log dekho'}
          done = os.path.exists(f'data/{acc}/strategy.json') and st.get('stage') in ('fetched', 'done')
          out = {'state': 'done' if done else 'error', 'stage': st.get('stage'), 'msg': st.get('msg', ''),
                 'at': int(time.time()), 'run': os.environ.get('RUN_URL', '')}
          json.dump(out, open(f'data/{acc}/scan.json', 'w'), indent=1)
          print(out)
          PY
          git config user.name "strategy-scan"
          git config user.email "strategy-scan@users.noreply.github.com"
          git add "data/$IW_LOGIN"
          if git diff --cached --quiet; then echo "koi badlav nahi"; exit 0; fi
          git commit -q -m "scan $IW_LOGIN $(date -u +%d%b-%H:%M)"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then exit 0; fi
            sleep $((i*5))
          done
          exit 1
