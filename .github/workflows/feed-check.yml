# SamuSignal Data Feed ki jaanch (sirf haath se chalao) — Firebase /feed padhkar log me haalat likhta hai.
# Koi commit nahi, koi key log me nahi. Secrets: FIREBASE_URL, FIREBASE_AUTH (paper-sync wale hi).
# 16 Nov: Candle (Strategy 5) VPS paper ka hisaab bhi (/candle/vps, /candle/cfg, /candle/paper) — sirf naap.
name: Data Feed check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Feed ki haalat
        env:
          FB_URL: ${{ secrets.FIREBASE_URL }}
          FB_AUTH: ${{ secrets.FIREBASE_AUTH }}
        run: |
          B="${FB_URL%/}"; case "$B" in http*) ;; *) B="https://$B";; esac
          A=""; if [ -n "$FB_AUTH" ]; then A="?auth=$FB_AUTH"; fi
          curl -sS --max-time 30 "$B/feed/meta.json$A" -o meta.json || true
          curl -sS --max-time 30 "$B/feed/live.json$A" -o live.json || true
          curl -sS --max-time 30 "$B/feed/bars/1min/EURUSD.json$A" -o bars.json || true
          curl -sS --max-time 30 "$B/feed/news/meta.json$A" -o nmeta.json || true
          curl -sS --max-time 30 "$B/feed/news/cal.json$A" -o ncal.json || true
          curl -sS --max-time 30 "$B/copytrade/vps.json$A" -o vps.json || true
          curl -sS --max-time 30 "$B/feed/news/paper.json$A" -o npaper.json || true
          Q="?orderBy=%22%24key%22&limitToLast=40"; if [ -n "$FB_AUTH" ]; then Q="$Q&auth=$FB_AUTH"; fi
          curl -sS --max-time 30 "$B/samuai/auto/scan.json$A" -o ascan.json || true
          curl -sS --max-time 30 "$B/samuai/auto/state.json$A" -o astate.json || true
          curl -sS --max-time 30 "$B/samuai/auto/sig.json$Q" -o asig.json || true
          # Candle (Strategy 5) — VPS scanner ka paper: sirf naap, koi key / balance nahi
          C="?orderBy=%22%24key%22&limitToLast=1500"; if [ -n "$FB_AUTH" ]; then C="$C&auth=$FB_AUTH"; fi
          curl -sS --max-time 30 "$B/candle/vps.json$A" -o cvps.json || true
          curl -sS --max-time 30 "$B/candle/cfg.json$A" -o ccfg.json || true
          curl -sS --max-time 60 "$B/candle/paper.json$C" -o cpaper.json || true
          curl -sS --max-time 30 "$B/candle/ea/state.json$A" -o ceast.json || true
          E="?orderBy=%22%24key%22&limitToLast=500"; if [ -n "$FB_AUTH" ]; then E="$E&auth=$FB_AUTH"; fi
          curl -sS --max-time 30 "$B/candle/ea/trades.json$E" -o cetr.json || true
          python3 - <<'PY'
          import json, time, re
          def load(p):
              try: return json.load(open(p))
              except Exception as e: return {'_err': str(e)}
          now = time.time()
          m = load('meta.json') or {}
          print('META:', json.dumps({k: m.get(k) for k in ('at', 'acct', 'n', 'ver', 'off', 'error', '_err') if k in m}))
          if isinstance(m, dict) and m.get('at'):
              print('FEED_AGE_SEC:', int(now - m['at']), '(120 se kam = chalu)')
          L = load('live.json') or {}
          if isinstance(L, dict) and '_err' not in L and 'error' not in L:
              print('LIVE_SYMBOLS:', len(L))
              for s in ('EURUSD', 'GBPUSD', 'XAUUSD'):
                  q = L.get(s) or {}
                  if q: print('LIVE', s, 'bid', q.get('b'), 'spread', q.get('sp'), 'age_sec', int(now - (q.get('t') or now)))
          else:
              print('LIVE:', json.dumps(L)[:200])
          b = load('bars.json')
          if isinstance(b, str) and b:
              last = b.split(';')[-1].split(',')
              print('BARS_1MIN_EURUSD:', len(b.split(';')), 'candles, last t', last[0], 'age_sec', int(now - int(last[0])))
          else:
              print('BARS:', json.dumps(b)[:200])
          nm = load('nmeta.json')
          print('NEWS_META:', json.dumps(nm)[:200], '| age_sec', int(now - nm['at']) if isinstance(nm, dict) and nm.get('at') else '-')
          nc = load('ncal.json')
          if isinstance(nc, dict) and nc.get('list'):
              print('NEWS_CAL:', nc.get('n'), 'events, age_sec', int(now - nc.get('at', now)))
              for e in [x for x in nc['list'] if x.get('imp') == 'High'][:6]: print('  ', time.strftime('%d %b %H:%M', time.gmtime(e['t'] + 19800)), 'IST', e['title'], 'F', e.get('fc'), 'P', e.get('pv'), 'A', e.get('act'))
          else:
              print('NEWS_CAL:', json.dumps(nc)[:200])
          npp = load('npaper.json')
          if isinstance(npp, dict) and '_err' not in npp:
              for k, p in sorted(npp.items(), key=lambda kv: kv[1].get('at', 0) if isinstance(kv[1], dict) else 0)[-8:]:
                  if not isinstance(p, dict): continue
                  sg = ' | '.join(f"{n} {g.get('dir')} @{g.get('entry')} 1m {g.get('u1')} 5m {g.get('u5')} tgt {g.get('uT')} hit {g.get('hit')}" for n, g in (p.get('sigs') or {}).items())
                  print('NEWS_PAPER:', time.strftime('%d %b %H:%M', time.gmtime((p.get('t') or 0) + 19800)), 'IST', p.get('title'), p.get('act'), 'vs', p.get('fc'), 'usd', p.get('usd'), 'conf', p.get('conf'), '::', sg)
          else:
              print('NEWS_PAPER:', json.dumps(npp)[:200])
          # SAMUSIGNAL AI AUTO (demo EA + VPS scanner): scan / halat / aakhri signal — balance / login / ticket NAHI
          now = time.time()
          ist = lambda t: time.strftime('%d %b %H:%M', time.gmtime((t or 0) + 19800))
          sc = load('ascan.json')
          if isinstance(sc, dict) and sc.get('t'):
              print('AUTO_SCAN:', ist(sc['t']), 'IST | age_min', int((now - sc['t']) / 60), '| ok', sc.get('ok'), '| pairs', sc.get('pairs'), 'achhe', sc.get('cand'), 'AI', sc.get('ai'), 'sahmat', sc.get('agree'), 'bheje', sc.get('sent'), '| aiToday', sc.get('aiToday'), '|', sc.get('why') or '', '| top', ' '.join(f"{x.get('n')}:{x.get('dir','')[:1]}{x.get('g')}:{x.get('a')}" for x in (sc.get('top') or [])))
          else:
              print('AUTO_SCAN:', json.dumps(sc)[:200])
          stt = load('astate.json')
          if isinstance(stt, dict) and stt.get('t'):
              print('AUTO_EA:', 'v' + str(stt.get('v')), '| age_sec', int(now - stt['t']), '| stop', stt.get('stop'), '|', stt.get('why') or '', '| open', stt.get('open'), 'pend', stt.get('pend'), '| busy', ' '.join(stt.get('busy') or []), '| news', ' '.join(stt.get('news') or []), '|', stt.get('status') or '')
          else:
              print('AUTO_EA:', json.dumps(stt)[:200])
          sg = load('asig.json')
          if isinstance(sg, dict) and '_err' not in sg:
              for k in sorted(sg)[-40:]:
                  x = sg[k]
                  if not isinstance(x, dict): continue
                  st_ = x.get('st') or '(EA ne abhi nahi dekha)'
                  msg = '' if st_ == 'PLACED' else re.sub(r'#\d+\s*', '', str(x.get('msg') or ''))[:90]
                  print('AUTO_SIG:', ist(x.get('at')), x.get('sym'), x.get('dir'), 'AI', x.get('conf'), '->', st_, msg)
          else:
              print('AUTO_SIG:', json.dumps(sg)[:200])
          # VPS Helper: sirf "News" wali compile / log lines (koi secret nahi)
          v = load('vps.json')
          def walk(o, path=''):
              if isinstance(o, dict):
                  for k, x in o.items(): walk(x, path + '/' + str(k))
              elif isinstance(o, list):
                  for i, x in enumerate(o): walk(x, path + '[' + str(i) + ']')
              elif isinstance(o, str) and ('News' in o or 'news' in o): print('VPS', path[-60:], '|', o[:220])
          if isinstance(v, dict): print('VPS_KEYS:', list(v.keys())[:12], '| at', v.get('at') or v.get('ts')); walk(v)
          else: print('VPS:', json.dumps(v)[:200])
          # --- SAMUSIGNAL CANDLE EA (demo): halat + trade (balance / equity / login NAHI chhaapte) ---
          es = load('ceast.json')
          if isinstance(es, dict) and es.get('t'):
              print('CANDLE_EA: v' + str(es.get('v')), '| age_sec', int(now - es['t']), '| demo', es.get('demo'), '| tf', es.get('tf'), '| pairs', es.get('pairs'), '| open', es.get('open'), '/', es.get('max'), '| aaj $', es.get('dayPl'), 'jeet', es.get('dayW'), 'haar', es.get('dayL'), '| stop', es.get('stop') or '-', '| last', es.get('last'), '| skip', es.get('skip'))
          else:
              print('CANDLE_EA:', json.dumps(es)[:200])
          et = load('cetr.json')
          if isinstance(et, dict) and '_err' not in et and 'error' not in et:
              T = [x for x in et.values() if isinstance(x, dict)]
              T.sort(key=lambda x: x.get('next') or 0)
              Dn = [x for x in T if x.get('done') and isinstance(x.get('pl'), (int, float))]
              w = sum(1 for x in Dn if x['pl'] > 0); l = sum(1 for x in Dn if x['pl'] < 0)
              print('CANDLE_EA_TRADES: kul', len(T), '| band', len(Dn), '| chalu', len(T) - len(Dn), '| jeet', w, 'haar', l, '| net $', round(sum(x['pl'] for x in Dn), 2))
              Dy = {}
              for x in Dn: Dy.setdefault(time.strftime('%d %b', time.gmtime((x.get('next') or 0) / 1000 + 19800)), []).append(x)
              for k, L in Dy.items(): print('   EA_DIN', k, 'n', len(L), 'net $', round(sum(x['pl'] for x in L), 2), 'haar', sum(1 for x in L if x['pl'] < 0))
              R = {}
              for x in Dn: R.setdefault(x.get('res'), []).append(x)
              for k, L in R.items(): print('   EA_RES', k, 'n', len(L), 'net $', round(sum(x['pl'] for x in L), 2))
              for x in T[-15:]:
                  print('   EA_LAST', ist((x.get('next') or 0) / 1000), x.get('n'), x.get('dir'), x.get('res') or 'chalu', 'pl', x.get('pl'), 'cn', x.get('cn'), 'tp', x.get('tp'), 'spread', x.get('spread'))
          else:
              print('CANDLE_EA_TRADES:', json.dumps(et)[:200])
          # --- CANDLE (Strategy 5) VPS paper ka hisaab ---
          cv = load('cvps.json')
          if isinstance(cv, dict) and cv.get('t'):
              print('CANDLE_VPS: v' + str(cv.get('v')), '| age_sec', int(now - cv['t']), '| push tf', cv.get('tf'), '| tfs', cv.get('tfs'), '| pairs', cv.get('pairs'), '| paper', cv.get('paper'), '| reset', cv.get('reset'))
          else:
              print('CANDLE_VPS:', json.dumps(cv)[:200])
          cc = load('ccfg.json')
          if isinstance(cc, dict) and '_err' not in cc:
              print('CANDLE_CFG:', json.dumps({k: cc.get(k) for k in ('tf', 'autoPaper', 'pairs') if k in cc})[:300])
          cp = load('cpaper.json')
          if isinstance(cp, dict) and '_err' not in cp and 'error' not in cp:
              P = [x for x in cp.values() if isinstance(x, dict)]
              P.sort(key=lambda x: x.get('at') or 0)
              num = lambda v: isinstance(v, (int, float))
              day = lambda t: time.strftime('%d %b', time.gmtime((t or 0) / 1000 + 19800))
              print('CANDLE_PAPER: kul', len(P), '| pehla', ist((P[0].get('at') or 0) / 1000) if P else '-', '| aakhri', ist((P[-1].get('at') or 0) / 1000) if P else '-')
              def line(tag, L):
                  if not L: print('  ', tag, '-'); return
                  w = sum(1 for x in L if x['pl'] > 0); l = sum(1 for x in L if x['pl'] < 0)
                  print('  ', tag, 'n', len(L), 'jeet', w, 'haar', l, 'sifar', len(L) - w - l, 'wr', round(100 * w / len(L), 1), 'net $', round(sum(x['pl'] for x in L), 2), 'avg $', round(sum(x['pl'] for x in L) / len(L), 3), 'sabse bura $', round(min(x['pl'] for x in L), 2))
              for tf in (1,):                                   # 16 Nov: sirf 1 MIN (user)
                  T = [x for x in P if str(x.get('tf')) == str(tf)]
                  D = [x for x in T if x.get('done') and num(x.get('pl'))]
                  print('CANDLE_TF', tf, 'MIN: kul', len(T), '| band', len(D), '| chalu', sum(1 for x in T if not x.get('done')))
                  line('SAB', D)
                  R = {}
                  for x in D: R.setdefault(x.get('res'), []).append(x)
                  for k, L in sorted(R.items(), key=lambda kv: -len(kv[1])): line('RES ' + str(k), L)
                  M = [x['mae'] for x in D if num(x.get('mae'))]
                  TVK = ('T30', 'T50', 'T75', 'T100', 'TR', 'B25')            # 16 Nov: TP ka naap (scanner v1.10)
                  TV = [x for x in D if isinstance(x.get('tv'), dict) and all(isinstance(x['tv'].get(v), dict) and num(x['tv'][v].get('pl')) for v in TVK)]
                  if TV:
                      print('   TPV n', len(TV), '|', ' | '.join(v + ' $' + str(round(sum(x['tv'][v]['pl'] for x in TV), 2)) + ' haar ' + str(sum(1 for x in TV if x['tv'][v]['pl'] < 0)) for v in TVK))
                      F1 = [x['mfe1'] for x in TV if num(x.get('mfe1'))]
                      if F1: print('   MFE1 avg $', round(sum(F1) / len(F1), 2), '| TP avg $', round(sum(x.get('tp') or 0 for x in TV) / len(TV), 2))
                  if M: print('   MAE n', len(M), 'sabse gehra $', round(min(M), 2), 'avg $', round(sum(M) / len(M), 2), '| < -1:', sum(1 for v in M if v <= -1), '< -3:', sum(1 for v in M if v <= -3), '< -5:', sum(1 for v in M if v <= -5), '< -10:', sum(1 for v in M if v <= -10))
                  for c in ('G', 'Y', 'R'): line('WX ' + c, [x for x in D if isinstance(x.get('wx'), dict) and x['wx'].get('c') == c])
                  for i in ('1', '2', '3', '4'):
                      for v in (True, False):
                          line('PUSHTI ' + i + ' ' + ('haan' if v else 'nahi'), [x for x in D if isinstance(x.get('cf'), (dict, list)) and (x['cf'].get(i) if isinstance(x['cf'], dict) else (x['cf'][int(i)] if len(x['cf']) > int(i) else None)) is v])
                  S = {}
                  for x in D: S.setdefault(x.get('sym'), []).append(x)
                  for k, L in sorted(S.items(), key=lambda kv: -len(kv[1])): line('PAIR ' + str(k), L)
                  Dy = {}
                  for x in D: Dy.setdefault(day(x.get('at')), []).append(x)
                  for k, L in Dy.items(): line('DIN ' + k, L)
                  for x in [y for y in D if y['pl'] < 0]:
                      w = x.get('wx') if isinstance(x.get('wx'), dict) else {}
                      cf = x.get('cf') if isinstance(x.get('cf'), dict) else {}
                      print('   LOSS', ist((x.get('at') or 0) / 1000), '| candle', ist((x.get('next') or 0) / 1000), '->', ist((x.get('exitT') or 0) / 1000), '|', x.get('sym'), x.get('dir'), x.get('res'), 'pl', x.get('pl'), '| n', x.get('n'), '| mae', round(x['mae'], 2) if num(x.get('mae')) else None, '| tp', x.get('tp'), 'sl', x.get('sl'), '| entry', x.get('entry'), 'spread', x.get('spread'), 'k', x.get('k'), '| wx', w.get('c'), ' '.join(w.get('why') or []), '| pushti', ''.join(('Y' if cf.get(i) is True else 'N' if cf.get(i) is False else '-') for i in '1234'), '| why', str(x.get('why') or '')[:80])
                  for x in D[-12:]:
                      print('   LAST', ist((x.get('at') or 0) / 1000), x.get('sym'), x.get('dir'), x.get('res'), 'pl', x.get('pl'), 'n', x.get('n'), 'mae', round(x['mae'], 2) if num(x.get('mae')) else None, 'tp', x.get('tp'), 'wx', (x.get('wx') or {}).get('c') if isinstance(x.get('wx'), dict) else None)
          else:
              print('CANDLE_PAPER:', json.dumps(cp)[:200])
          PY
